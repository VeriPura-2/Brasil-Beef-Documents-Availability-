<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeriPura — Brazil Beef Corridor Validation Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2444;
  --gold:#D4A847;
  --sky:#D6E4F0;
  --pale:#EBF3FA;
  --ink:#1A2332;
  --tertiary:#9AAFCA;
  --ok:#2E7D5B;
  --no:#B23A48;
  --white:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--pale);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}

/* Header */
header{
  background:var(--navy);
  color:var(--white);
  padding:40px 0 32px;
  border-bottom:3px solid var(--gold);
}
.wordmark{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:40px;
  color:var(--white);
  letter-spacing:.5px;
}
.eyebrow{
  font-family:'DM Mono',monospace;
  color:var(--gold);
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:10px;
}
.subtitle{
  font-family:'DM Serif Display',serif;
  font-size:22px;
  color:var(--sky);
  margin-top:6px;
  font-weight:400;
}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}

/* Lang toggle */
.langtoggle{
  display:inline-flex;
  border:1px solid var(--gold);
  border-radius:999px;
  overflow:hidden;
  font-family:'DM Mono',monospace;
  font-size:13px;
  flex-shrink:0;
}
.langtoggle button{
  background:transparent;
  color:var(--sky);
  border:none;
  padding:8px 18px;
  cursor:pointer;
  font-family:inherit;
  font-size:13px;
  letter-spacing:1px;
  transition:.15s;
}
.langtoggle button.active{background:var(--gold);color:var(--navy);font-weight:500}

/* Controls */
.controls{
  background:var(--white);
  border:1px solid var(--sky);
  border-radius:12px;
  padding:18px 20px;
  margin:28px 0 18px;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  align-items:center;
}
.control-group{display:flex;flex-direction:column;gap:5px}
.control-group label{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--tertiary);
}
.controls input[type="text"],.controls select{
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  padding:9px 12px;
  border:1px solid var(--sky);
  border-radius:8px;
  background:var(--pale);
  color:var(--ink);
  min-width:200px;
}
.controls input:focus,.controls select:focus{
  outline:2px solid var(--gold);
  outline-offset:1px;
  border-color:var(--gold);
}
.count{
  margin-left:auto;
  font-family:'DM Mono',monospace;
  font-size:13px;
  color:var(--navy);
  align-self:flex-end;
  padding-bottom:9px;
}
.count b{color:var(--gold)}

/* Tabs */
.tabs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tab{
  font-family:'DM Mono',monospace;
  font-size:13px;
  letter-spacing:.5px;
  padding:11px 20px;
  border:none;
  background:transparent;
  color:var(--tertiary);
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:.15s;
}
.tab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:500}
.tab:hover:not(.active){color:var(--navy)}

/* Table */
.tablecard{
  background:var(--white);
  border:1px solid var(--sky);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:40px;
}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  background:var(--navy);
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-weight:500;
  text-align:left;
  padding:14px 16px;
  font-size:13px;
  letter-spacing:.3px;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
  position:sticky;
  top:0;
}
thead th:hover{background:#16315c}
th .arrow{color:var(--gold);font-size:11px;margin-left:5px;opacity:.4}
th.sorted .arrow{opacity:1}
tbody td{padding:13px 16px;border-bottom:1px solid var(--pale);vertical-align:top}
tbody tr:nth-child(even){background:#FAFCFE}
tbody tr:hover{background:var(--pale)}
td.dado{font-weight:500;color:var(--navy)}
td.notas{color:#55657d;font-size:13px;max-width:280px}

/* Badges */
.badge{
  display:inline-block;
  font-family:'DM Mono',monospace;
  font-size:11px;
  font-weight:500;
  letter-spacing:.5px;
  padding:3px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.badge.ok{background:#E3F2EA;color:var(--ok)}
.badge.no{background:#F8E5E8;color:var(--no)}
.cat-pill{
  display:inline-block;
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:.5px;
  padding:3px 9px;
  border-radius:6px;
  background:var(--pale);
  color:var(--navy);
  border:1px solid var(--sky);
  white-space:nowrap;
}
.impact{font-family:'DM Mono',monospace;font-size:12px;font-weight:500}
.impact.high{color:var(--no)}
.impact.med{color:var(--gold)}
.score{font-family:'DM Mono',monospace;font-weight:500;color:var(--navy)}

footer{
  padding:28px 0 48px;
  text-align:center;
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:var(--tertiary);
  letter-spacing:.5px;
}
.empty{padding:48px;text-align:center;color:var(--tertiary);font-family:'DM Mono',monospace;font-size:14px}
@media(max-width:640px){
  .wordmark{font-size:30px}
  td.notas{max-width:180px}
  .count{margin-left:0;width:100%}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="headrow">
      <div>
        <div class="eyebrow" data-i18n="eyebrow">Document Validation Inventory</div>
        <div class="wordmark">VeriPura</div>
        <div class="subtitle" data-i18n="subtitle">Brazil → UK Beef Corridor</div>
      </div>
      <div class="langtoggle" role="group" aria-label="Language">
        <button id="btn-pt" class="active" onclick="setLang('pt')">PT</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-tab="inv" data-i18n="tab_inv">Data Inventory</button>
    <button class="tab" data-tab="sis" data-i18n="tab_sis">Systems</button>
    <button class="tab" data-tab="notas" data-i18n="tab_notas">Integration Notes</button>
  </div>

  <!-- INVENTORY -->
  <div id="panel-inv">
    <div class="controls">
      <div class="control-group">
        <label data-i18n="search_label">Search</label>
        <input type="text" id="search" data-i18n-ph="search_ph" placeholder="Filter by any field...">
      </div>
      <div class="control-group">
        <label data-i18n="cat_label">Category</label>
        <select id="catfilter"></select>
      </div>
      <div class="control-group">
        <label data-i18n="avail_label">Availability</label>
        <select id="availfilter"></select>
      </div>
      <div class="count"><span data-i18n="showing">Showing</span> <b id="rowcount">0</b> <span data-i18n="of">of</span> <span id="rowtotal">0</span></div>
    </div>
    <div class="tablecard">
      <div class="scroll">
        <table id="invtable">
          <thead><tr id="invhead"></tr></thead>
          <tbody id="invbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- SYSTEMS -->
  <div id="panel-sis" style="display:none">
    <div class="tablecard" style="margin-top:18px">
      <div class="scroll">
        <table id="sistable">
          <thead><tr id="sishead"></tr></thead>
          <tbody id="sisbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- NOTES -->
  <div id="panel-notas" style="display:none">
    <div class="tablecard" style="margin-top:18px">
      <div class="scroll">
        <table id="notastable">
          <thead><tr id="notashead"></tr></thead>
          <tbody id="notasbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="wrap" data-i18n="footer">Source: Aécio Flores (FSTEC) validation responses · June 2026</div>
</footer>

<script>

    showing:"Exibindo",
    of:"de",
    footer:"Fonte: respostas de validação de Aécio Flores (FSTEC) · Junho 2026",
    all:"Todas",
    all_av:"Todas"
  },

/* ---------- data: [pt,en] pairs for translated values ---------- */
const INV=[
 {cat:["Identidade Animal","Animal Identity"],dado:["SISBOV","SISBOV"],fonte:["MAPA / SISBOV","MAPA / SISBOV"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["",""]},

 {cat:["Movimentação","Movement"],dado:["GTA","GTA"],fonte:["Estados / MAPA","States / MAPA"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["",""]},
 {cat:["Movimentação","Movement"],dado:["Atestado sanitário","Health certificate"],fonte:["Veterinário / Estado","Veterinarian / State"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["",""]},
 {cat:["Produção","Production"],dado:["Registro de confinamento","Feedlot record"],fonte:["MAPA / Estado","MAPA / State"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["",""]},
 {cat:["Produção","Production"],dado:["Registros alimentação","Feed records"],fonte:["Produtor","Producer"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["Protocolo de produção proprio","Own production protocol"]},
 {cat:["Produção","Production"],dado:["Registros veterinários","Veterinary records"],fonte:["Produtor","Producer"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["Dentro do protocolo de produção geral - Mapa de manejo","Within the general production protocol - management plan"]},
 {cat:["Abate","Slaughter"],dado:["SIF registro","SIF registration"],fonte:["MAPA - SIF","MAPA - SIF"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},
 {cat:["Abate","Slaughter"],dado:["Inspeção ante-mortem","Ante-mortem inspection"],fonte:["SIF","SIF"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},
 {cat:["Abate","Slaughter"],dado:["Inspeção post-mortem","Post-mortem inspection"],fonte:["SIF","SIF"],avail:["Disponível","Available"],timeline:["Pós abate","Post-slaughter"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},
 {cat:["Abate","Slaughter"],dado:["Lote de abate","Slaughter batch"],fonte:["Frigorífico","Meatpacker"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},

 {cat:["Logística","Logistics"],dado:["Temperatura cadeia fria","Cold chain temperature"],fonte:["Operadores logísticos","Logistics operators"],avail:["Disponível","Available"],timeline:["Pós abate","Post-slaughter"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},
 {cat:["Logística","Logistics"],dado:["Registros transporte","Transport records"],fonte:["Transportadoras","Carriers"],avail:["Disponível","Available"],timeline:["Pré abate","Pre-slaughter"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},

 {cat:["Ambiental","Environmental"],dado:["CAR geolocalização","CAR geolocation"],fonte:["SICAR","SICAR"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["",""]},
 {cat:["Ambiental","Environmental"],dado:["IBAMA embargos","IBAMA embargoes"],fonte:["IBAMA","IBAMA"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["",""]},
 {cat:["Ambiental","Environmental"],dado:["Uso do solo","Land use"],fonte:["Geoespacial","Geospatial"],avail:["Disponível","Available"],timeline:["Pré embarque","Pre-shipment"],formato:["Papel","Paper"],owner:["Certificadora","Certification body"],notas:["",""]},
 {cat:["Exportação","Export"],dado:["CSI / CZI","CSI / CZI"],fonte:["MAPA","MAPA"],avail:["Disponível","Available"],timeline:["Pós abate","Post-slaughter"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},
 {cat:["Exportação","Export"],dado:["DU-E (SISCOMEX)","DU-E (SISCOMEX)"],fonte:["Receita Federal","Federal Revenue"],avail:["Disponível","Available"],timeline:["Pós abate","Post-slaughter"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},
 {cat:["Exportação","Export"],dado:["Certificado de origem","Certificate of origin"],fonte:["Câmaras de comércio","Chambers of commerce"],avail:["Disponível","Available"],timeline:["Pós abate","Post-slaughter"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]},
 {cat:["Exportação","Export"],dado:["Packing list / invoice","Packing list / invoice"],fonte:["Exportador","Exporter"],avail:["Disponível","Available"],timeline:["Pós abate","Post-slaughter"],formato:["Papel","Paper"],owner:["Frigorífico","Meatpacker"],notas:["",""]}

const SIS=[
 {sis:["SISBOV","SISBOV"],tipo:["Identificação animal","Animal identification"],resp:["MAPA","MAPA"],obs:["Integrado via sistema da certificadora - API","Integrated via certification body's system - API"]},
 {sis:["GTA","GTA"],tipo:["Movimentação animal","Animal movement"],resp:["Estados","States"],obs:["Informado a partir dos orgãos de defesa","Reported by agricultural defense agencies"]},
 {sis:["SIF","SIF"],tipo:["Inspeção federal","Federal inspection"],resp:["MAPA","MAPA"],obs:["Informado na GTA de abate","Reported in the slaughter GTA"]},
 {sis:["CAR","CAR"],tipo:["Ambiental","Environmental"],resp:["SICAR / MMA","SICAR / MMA"],obs:["Integrado via sistema da certificadora - API","Integrated via certification body's system - API"]},
 {sis:["SISCOMEX","SISCOMEX"],tipo:["Exportação","Export"],resp:["Receita Federal","Federal Revenue"],obs:["A partir do processo de exportação gerenciado pelo frigorifico","From the export process managed by the meatpacker"]},
 {sis:["IBAMA","IBAMA"],tipo:["Fiscalização ambiental","Environmental enforcement"],resp:["IBAMA","IBAMA"],obs:["Integrado via sistema da certificadora - API","Integrated via certification body's system - API"]}
];

const NOTAS=[
 {tema:["APIs","APIs"],desc:["Disponibilidade de integração digital","Digital integration availability"],impacto:["Alto","High"],score:10},
 {tema:["Processos manuais","Manual processes"],desc:["Uso de documentos PDF e planilhas","Use of PDF documents and spreadsheets"],impacto:["Médio","Medium"],score:7},
 {tema:["Batch vs tempo real","Batch vs real-time"],desc:["Frequência de atualização dos dados","Data refresh frequency"],impacto:["Médio","Medium"],score:7},
 {tema:["Qualidade de dados","Data quality"],desc:["Consistência entre estados e sistemas federais","Consistency across state and federal systems"],impacto:["Alto","High"],score:9}
];

/* ---------- state ---------- */
let lang="pt";
let sortCol=null, sortDir=1;
const L=i=>lang==="pt"?0:1;

/* ---------- render inventory ---------- */
function renderInvHead(){
  const c=COLS[lang];
  const order=["cat","dado","fonte","avail","timeline","formato","owner","notas"];
  document.getElementById("invhead").innerHTML=order.map(k=>{
    const sorted=sortCol===k?"sorted":"";
    const ar=sortCol===k?(sortDir>0?"▲":"▼"):"▲";
    return `<th class="${sorted}" onclick="sortBy('${k}')">${c[k]}<span class="arrow">${ar}</span></th>`;
  }).join("");
}
function buildFilters(){
  const cats=[...new Set(INV.map(r=>r.cat[L()]))];
  const cs=document.getElementById("catfilter");
  cs.innerHTML=`<option value="">${I18N[lang].all}</option>`+cats.map(c=>`<option value="${c}">${c}</option>`).join("");
  const avs=[...new Set(INV.map(r=>r.avail[L()]).filter(Boolean))];
  const as=document.getElementById("availfilter");
  as.innerHTML=`<option value="">${I18N[lang].all_av}</option>`+avs.map(a=>`<option value="${a}">${a}</option>`).join("");
}
function renderInvBody(){
  const q=document.getElementById("search").value.toLowerCase();
  const cf=document.getElementById("catfilter").value;
  const af=document.getElementById("availfilter").value;
  const order=["cat","dado","fonte","avail","timeline","formato","owner","notas"];
  let rows=INV.map(r=>r);
  if(sortCol){
    rows=[...rows].sort((a,b)=>{
      const x=a[sortCol][L()]||"",y=b[sortCol][L()]||"";
      return x.localeCompare(y,lang)*sortDir;
    });
  }
  rows=rows.filter(r=>{
    if(cf&&r.cat[L()]!==cf)return false;
    if(af&&r.avail[L()]!==af)return false;
    if(q){
      const hay=order.map(k=>r[k][L()]).join(" ").toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  const body=document.getElementById("invbody");
  if(!rows.length){body.innerHTML=`<tr><td colspan="8" class="empty">—</td></tr>`;}
  else{
    body.innerHTML=rows.map(r=>{
      const av=r.avail[L()];
      const badge=av?`<span class="badge ${av==="Disponível"||av==="Available"?"ok":"no"}">${av}</span>`:"";
      return `<tr>
        <td><span class="cat-pill">${r.cat[L()]}</span></td>
        <td class="dado">${r.dado[L()]}</td>
        <td>${r.fonte[L()]}</td>
        <td>${badge}</td>
        <td>${r.timeline[L()]||"—"}</td>
        <td>${r.formato[L()]||"—"}</td>
        <td>${r.owner[L()]||"—"}</td>
        <td class="notas">${r.notas[L()]||""}</td>
      </tr>`;
    }).join("");
  }
  document.getElementById("rowcount").textContent=rows.length;
  document.getElementById("rowtotal").textContent=INV.length;
}
function sortBy(k){
  if(sortCol===k)sortDir*=-1;else{sortCol=k;sortDir=1;}
  renderInvHead();renderInvBody();
}

/* ---------- systems ---------- */
function renderSis(){
  const c=SISCOLS[lang];
  document.getElementById("sishead").innerHTML=["sis","tipo","resp","obs"].map(k=>`<th>${c[k]}</th>`).join("");
  document.getElementById("sisbody").innerHTML=SIS.map(r=>`<tr>
    <td class="dado">${r.sis[L()]}</td>
    <td>${r.tipo[L()]}</td>
    <td>${r.resp[L()]}</td>
    <td class="notas">${r.obs[L()]}</td>
  </tr>`).join("");
}

/* ---------- notes ---------- */
function renderNotas(){
  const c=NOTASCOLS[lang];
  document.getElementById("notashead").innerHTML=["tema","desc","impacto","score"].map(k=>`<th>${c[k]}</th>`).join("");
  document.getElementById("notasbody").innerHTML=NOTAS.map(r=>{
    const imp=r.impacto[L()];
    const cls=(imp==="Alto"||imp==="High")?"high":"med";
    return `<tr>
      <td class="dado">${r.tema[L()]}</td>
      <td>${r.desc[L()]}</td>
      <td><span class="impact ${cls}">${imp}</span></td>
      <td class="score">${r.score}</td>
    </tr>`;
  }).join("");
}

/* ---------- i18n apply ---------- */
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.getAttribute("data-i18n");
    if(I18N[lang][k])el.textContent=I18N[lang][k];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    const k=el.getAttribute("data-i18n-ph");
    if(I18N[lang][k])el.setAttribute("placeholder",I18N[lang][k]);
  });
}
function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.getElementById("btn-pt").classList.toggle("active",l==="pt");
  document.getElementById("btn-en").classList.toggle("active",l==="en");
  applyI18n();
  renderInvHead();buildFilters();renderInvBody();renderSis();renderNotas();
}

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    const id=t.getAttribute("data-tab");
    ["inv","sis","notas"].forEach(p=>{
      document.getElementById("panel-"+p).style.display=(p===id)?"block":"none";
    });
  });
});

/* ---------- events ---------- */
document.getElementById("search").addEventListener("input",renderInvBody);
document.getElementById("catfilter").addEventListener("change",renderInvBody);
document.getElementById("availfilter").addEventListener("change",renderInvBody);

/* ---------- init ---------- */
applyI18n();renderInvHead();buildFilters();renderInvBody();renderSis();renderNotas();
</script>
</body>
</html>
